<header class="app-navbar" *ngIf="currentUser$ | async as user">
  <div class="nav-container">
    <div class="nav-brand">
      <div class="brand-logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          <circle cx="12" cy="12" r="5"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">MPLOY<span class="brand-highlight">CHEK</span></span>
        <span class="brand-tagline">Verification &amp; Credential Platform</span>
      </div>
    </div>

    <div class="nav-actions">
      <div class="user-chip">
        <div class="user-avatar" [class.avatar-admin]="user.role === 'Admin'">
          {{ user.name.charAt(0).toUpperCase() }}
        </div>
        <div class="user-meta">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role-badge" [class.badge-admin]="user.role === 'Admin'" [class.badge-general]="user.role === 'General User'">
            {{ user.role }}
          </span>
        </div>
      </div>

      <button (click)="onLogout()" class="btn-logout" title="Sign out of portal">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>
</header>
